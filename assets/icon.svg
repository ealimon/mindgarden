<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="512" height="512" rx="112" fill="#5B4B8A"/>
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" opacity="0.35"/>
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#7A68B0"/>
      <stop offset="100%" stop-color="#5B4B8A"/>
    </radialGradient>
  </defs>

  <g transform="translate(256,266)">
    <!-- Forewings: pointed, sweep up and outward -->
    <path d="M 8,-15 C 40,-90 140,-110 175,-55 C 195,-15 165,25 100,25 C 55,25 20,5 8,-15 Z" fill="#E9C46A"/>
    <path d="M -8,-15 C -40,-90 -140,-110 -175,-55 C -195,-15 -165,25 -100,25 C -55,25 -20,5 -8,-15 Z" fill="#E9C46A"/>

    <!-- Hindwings: rounded, with a slight tail -->
    <path d="M 6,10 C 30,55 110,80 140,45 C 155,20 130,-10 80,-5 C 45,-2 15,5 6,10 Z" fill="#D9A44A"/>
    <path d="M -6,10 C -30,55 -110,80 -140,45 C -155,20 -130,-10 -80,-5 C -45,-2 -15,5 -6,10 Z" fill="#D9A44A"/>

    <!-- Bold, high-contrast wing marks (deliberately simple so they survive small sizes) -->
    <circle cx="128" cy="-45" r="15" fill="#4A3A73"/>
    <circle cx="-128" cy="-45" r="15" fill="#4A3A73"/>
    <circle cx="95" cy="30" r="10" fill="#4A3A73"/>
    <circle cx="-95" cy="30" r="10" fill="#4A3A73"/>

    <!-- Body -->
    <path d="M 0,-50 C 7,-50 10,-30 10,-5 C 10,25 7,65 0,68 C -7,65 -10,25 -10,-5 C -10,-30 -7,-50 0,-50 Z" fill="#3A362F"/>
    <circle cx="0" cy="-52" r="14" fill="#3A362F"/>

    <!-- Antennae: short and thick so they don't disappear at small icon sizes -->
    <path d="M -4,-60 C -14,-72 -20,-76 -24,-74" stroke="#3A362F" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 4,-60 C 14,-72 20,-76 24,-74" stroke="#3A362F" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="-24" cy="-74" r="5" fill="#3A362F"/>
    <circle cx="24" cy="-74" r="5" fill="#3A362F"/>
  </g>
</svg>
